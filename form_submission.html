<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#35838;&#31243;&#28155;&#21152;&#39029;&#38754;</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="section">
            <h1>&#35838;&#31243;&#28155;&#21152;</h1>
            <div class="form-grid">
                <div class="field">
                    <label for="coursename">&#35838;&#31243;&#21517;&#31216;</label>
                    <input type="text" id="coursename">
                </div>

                <div class="field">
                    <label for="coursenum">&#35838;&#31243;&#32534;&#21495;</label>
                    <input type="text" id="coursenum">
                </div>

                <div class="field">
                    <label for="day">&#21608;&#20960;</label>
                    <input type="number" id="day" min="1" max="7">
                </div>

                <div class="field">
                    <label for="starttime">&#24320;&#22987;&#26102;&#38388;</label>
                    <input type="text" id="starttime" placeholder="08:00">
                </div>

                <div class="field">
                    <label for="endtime">&#32467;&#26463;&#26102;&#38388;</label>
                    <input type="text" id="endtime" placeholder="09:30">
                </div>
            </div>
            <p id="formError" class="error-text"></p>
            <p id="storageNotice" class="notice"></p>

            <div class="button-row">
                <button id="addBtn" class="primary-button" type="button">add</button>
                <button id="submitBtn" type="button">submit</button>
                <button id="clearCoursesBtn" type="button">clear courses</button>
            </div>
        </section>

        <section class="section">
            <h2>&#35838;&#31243;&#34920;&#26041;&#26696;</h2>
            <div class="plan-grid">
                <div class="field">
                    <label for="planName">&#26041;&#26696;&#21517;&#31216;</label>
                    <input type="text" id="planName" placeholder="2026 Spring">
                </div>
                <div class="field">
                    <label for="planSelect">&#24050;&#20445;&#23384;&#26041;&#26696;</label>
                    <select id="planSelect"></select>
                </div>
            </div>
            <p id="planStatus" class="notice"></p>
            <div class="button-row">
                <button id="savePlanBtn" class="primary-button" type="button">save plan</button>
                <button id="refreshPlansBtn" type="button">refresh plans</button>
                <button id="loadPlanBtn" type="button">load selected</button>
                <button id="runPlanBtn" type="button">run selected</button>
                <button id="deletePlanBtn" type="button">delete selected</button>
            </div>
        </section>

        <section class="section">
            <h2>&#24050;&#28155;&#21152;&#35838;&#31243;&#21015;&#34920;</h2>
            <div id="courseListDisplay">
                <p>&#26242;&#26080;&#35838;&#31243;</p>
            </div>
        </section>

        <section class="section">
            <h3>&#25490;&#35838;&#31995;&#32479;&#21453;&#39304;</h3>
            <div id="outputContent" class="output-box">&#31561;&#24453;&#25552;&#20132;&#25968;&#25454;...</div>
            <div class="button-row">
                <button id="clearOutputBtn" type="button">clear output</button>
            </div>
        </section>
    </main>

    <script src="addcourse.js"></script>
    <script src="datatransmit.js"></script>
    <script>
        document.getElementById('addBtn').onclick = clickevent;
        document.getElementById('submitBtn').onclick = function (e) {
            uploadData(e);
        };
        document.getElementById('clearCoursesBtn').onclick = clearCourseList;
        document.getElementById('clearOutputBtn').onclick = clearOutput;
        document.getElementById('savePlanBtn').onclick = saveCurrentPlan;
        document.getElementById('refreshPlansBtn').onclick = loadPlanList;
        document.getElementById('loadPlanBtn').onclick = loadSelectedPlan;
        document.getElementById('runPlanBtn').onclick = runSelectedPlan;
        document.getElementById('deletePlanBtn').onclick = deleteSelectedPlan;
    </script>
</body>

</html>
